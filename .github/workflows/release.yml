name: Release

# Tag-driven. Push v0.1.0 to publish the onlytty runner binaries (+ SHA256SUMS) as a
# GitHub Release and the portal server image to GHCR. Uses only GITHUB_TOKEN — no
# external secrets. To re-run manually, dispatch this workflow WITH THE TAG SELECTED as
# the ref (the "Use workflow from" dropdown / `gh workflow run release.yml --ref vX.Y.Z`):
# the version, release tag, and image tag all derive from the run ref, so dispatching on a
# branch would mislabel every artifact.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: gate (check + e2e + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
      - run: mix deps.get
        working-directory: portal
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
      - run: make e2e
      - run: make audit

  runner-binaries:
    name: runner binaries → release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # mint the OIDC token Sigstore signs the attestation with
      attestations: write # record the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - name: Build linux/darwin × amd64/arm64
        working-directory: runner
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o onlytty ./cmd/onlytty
            tar -czf "../dist/onlytty-$VERSION-$os-$arch.tar.gz" onlytty
            rm -f onlytty
          done
          cd ../dist && shasum -a 256 *.tar.gz > SHA256SUMS
      - name: Viewer asset manifest (SHA-256 of every served viewer file)
        run: make viewer-hash > dist/VIEWER_HASHES
      - name: Attest build provenance for the binaries
        # SLSA provenance for every tarball listed in SHA256SUMS. Keyless (Sigstore,
        # via the OIDC token) — no secrets. Verify: gh attestation verify <tarball> --repo <repo>
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/onlytty-*.tar.gz
            dist/SHA256SUMS
            dist/VIEWER_HASHES

  portal-image:
    name: portal image → GHCR
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # mint the OIDC token Sigstore signs the attestation with
      attestations: write # record the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/onlytty" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch image so self-hosters on arm64 (Graviton, Ampere, Apple Silicon) can
      # pull and run without emulation. QEMU emulates arm64 for the build on the amd64
      # runner; buildx produces a single manifest list. The arm64 build runs the Elixir
      # release compile under emulation, so this step is slower than a single-arch build.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ./portal
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest build provenance for the image
        # Keyless SLSA provenance, pushed alongside the image in GHCR. Verify:
        # gh attestation verify oci://<image>:<tag> --repo <repo>
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
